<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sabin</title>
    <link rel="stylesheet" href="homepage.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Didot&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <section class="register-section">
      <div class="register-card">
        <h2>CREATE YOUR ACCOUNT</h2>
        <form>
          <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="fullname"
              placeholder="Your full name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Create a password"
              required
            />
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Re-enter your password"
              required
            />
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
            <symbol
              id="exclamation-triangle-fill"
              viewBox="0 0 16 16"
              fill="currentColor"
            >
              <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 
             1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 
             1.566zM8 5c.535 0 .954.462.9.995l-.35 
             3.507a.552.552 0 0 1-1.1 0L7.1 
             5.995A.905.905 0 0 1 8 5zm.002 
             6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
              />
            </symbol>
          </svg>
          <div
            class="alert alert-danger d-flex align-items-center gap-2"
            role="alert"
          >
            <svg
              class="bi flex-shrink-0"
              width="24"
              height="24"
              role="img"
              aria-label="Danger:"
            >
              <use xlink:href="#exclamation-triangle-fill"></use>
            </svg>
            <div>Passwords do not match.</div>
          </div>

          <button type="submit" class="btn btn-signup mt-3">Sign Up</button>
          <div class="login-link mt-3">
            Already have an account? <a href="login.html">Login here</a>
          </div>
        </form>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
